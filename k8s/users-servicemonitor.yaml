apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: users
  namespace: dev
  labels:
    app: users
    environment: dev
spec:
  selector:
    matchLabels:
      app: users
      environment: dev
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
