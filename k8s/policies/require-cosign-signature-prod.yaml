apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-cosign-signature-prod
  annotations:
    policies.kyverno.io/title: Require Cosign Signature in Production
    policies.kyverno.io/category: Image Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/description: >-
      Requires production workloads to use images signed with the configured cosign key.
      Enable validationFailureAction: enforce only after all production images are signed.
spec:
  validationFailureAction: audit
  background: true
  rules:
    - name: require-signed-images-in-prod
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - prod
      verifyImages:
        - imageReferences:
            - "docker.io/anikolaevdo/users*"
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      REPLACE_ME_WITH_YOUR_COSIGN_PUBLIC_KEY
                      -----END PUBLIC KEY-----
