name: Dev Deploy

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build image and deploy to dev
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/users
      IMAGE_TAG: dev
      NAMESPACE: dev
      KUBECONFIG: /tmp/kubeconfig
      MANIFEST_PATH: k8s/users-dev.yaml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Prepare kubeconfig
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 --decode > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl --kubeconfig "$KUBECONFIG" auth can-i get pods --all-namespaces

      - name: Create or update postgres dev Secret
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret generic postgres-dev-env \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.DEV_DB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Create or update users dev Secret
        run: |
          kubectl --kubeconfig "$KUBECONFIG" create secret generic users-dev-env \
            --from-literal=DB_HOST="postgres-dev.${NAMESPACE}.svc.cluster.local" \
            --from-literal=DB_NAME="users" \
            --from-literal=DB_PASSWORD="${{ secrets.DEV_DB_PASSWORD }}" \
            --from-literal=DB_USER="postgres" \
            --dry-run=client -o yaml | kubectl --kubeconfig "$KUBECONFIG" apply -f -

      - name: Apply dev manifests
        run: kubectl --kubeconfig "$KUBECONFIG" apply -f manifest-dev.yaml -f "$MANIFEST_PATH"

      - name: Set Docker image
        run: kubectl --kubeconfig "$KUBECONFIG" set image deployment/user-deployment users="${IMAGE_NAME}:${IMAGE_TAG}" --namespace "$NAMESPACE"

      - name: Restart Deployment
        run: kubectl --kubeconfig "$KUBECONFIG" rollout restart deployment/user-deployment --namespace "$NAMESPACE"

      - name: Wait for rollout
        run: kubectl --kubeconfig "$KUBECONFIG" rollout status deployment/user-deployment --namespace "$NAMESPACE" --timeout=180s

      - name: Health check
        run: |
          POD="$(kubectl --kubeconfig "$KUBECONFIG" get pod -l app=users,environment=dev --namespace "$NAMESPACE" -o jsonpath='{.items[0].metadata.name}')"
          kubectl --kubeconfig "$KUBECONFIG" exec "$POD" --namespace "$NAMESPACE" -- wget -qO- http://127.0.0.1:8080/users
          kubectl --kubeconfig "$KUBECONFIG" logs --tail=50 "$POD" --namespace "$NAMESPACE"
